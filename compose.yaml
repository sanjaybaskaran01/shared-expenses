services:
  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DEV_AUTH_BYPASS: "false"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    expose:
      - "3000"
    volumes:
      - expenses-data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  expenses-data:
