name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run security:audit -- --all-objects
      - run: bun audit --production
      - run: bun run validate
      - run: bun --filter @expenses/protocol build
      - run: bun --filter @expenses/web build
        env:
          VITE_API_URL: ${{ vars.TALLY_PUBLIC_API_URL }}
      - run: bun --filter @expenses/server build
      - run: bun run build:release-artifacts -- --commit "$GITHUB_SHA" --output release-artifact
      - name: Verify the production Worker package
        run: ./node_modules/.bin/wrangler deploy --dry-run --config apps/web/wrangler.jsonc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tally-release-${{ github.sha }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 30

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: cp apps/server/.env.example .env
      - run: docker compose build
        env:
          PUBLIC_API_URL: http://localhost:3000
